[package]
name = "jetstreamer-horizon"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true

[dependencies]
lencode.workspace = true
solana-pubkey.workspace = true
agave-geyser-plugin-interface.workspace = true
solana-message.workspace = true
solana-transaction.workspace = true
solana-transaction-error.workspace = true
solana-instruction-error.workspace = true
solana-transaction-status.workspace = true
solana-hash.workspace = true
solana-signature.workspace = true
solana-address.workspace = true
solana-clock.workspace = true
solana-reward-info.workspace = true
solana-transaction-context.workspace = true
solana-system-interface.workspace = true
solana-cpi.workspace = true
once_cell.workspace = true
sha2.workspace = true
zstd.workspace = true
lz4.workspace = true
xxhash-rust.workspace = true
thiserror.workspace = true

[dev-dependencies]
ahash.workspace = true
criterion.workspace = true
env_logger.workspace = true
solana-account-decoder-client-types.workspace = true
tempfile.workspace = true
jetstreamer-firehose.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures-util.workspace = true
solana-message.workspace = true
solana-pubkey.workspace = true
# verify_archive --full: canonical PoH recompute + seed fetch
solana-entry.workspace = true
# shred_compression example: wire-format baseline. bincode here is deliberate
# and correct: it IS the turbine wire encoding in agave 3.x. Swap to wincode
# (byte-identical, preferred) once the workspace reaches solana-transaction
# >= 3.1, whose `wincode` feature is currently blocked by an agave =3.0.2 pin.
bincode.workspace = true
solana-transaction.workspace = true
serde = { workspace = true, features = ["derive"] }
solana-signature.workspace = true
reqwest = { workspace = true, features = ["blocking", "json"] }
serde_json.workspace = true

[[bench]]
name = "encode_decode"
harness = false

[[bench]]
name = "notification_types"
harness = false
