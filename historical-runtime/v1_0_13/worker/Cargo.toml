[package]
name = "jetstreamer-historical-worker-v1-0-13"
version = "0.1.0"
edition = "2018"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

[features]
# Test-only escape hatch used to exercise sha2 0.9.9's portable backend on
# SHA-NI hosts. Production builds leave this disabled and runtime-dispatch.
poh-force-soft = ["sha2-fast/force-soft"]

[dependencies]
bincode = "=1.2.1"
bzip2 = "=0.3.3"
jetstreamer-historical-protocol = { path = "../protocol" }
num_cpus = "=1.12.0"
rand = "=0.6.5"
rand_chacha = "=0.1.1"
rayon = "=1.2.0"
serde = "=1.0.105"
sha2 = "=0.8.1"
sha2-fast = { package = "sha2", version = "=0.9.9", features = ["compress"] }
solana-runtime = { path = "../vendor/solana-runtime-1.0.13", version = "=1.0.13" }
solana-config-program = { git = "https://github.com/solana-labs/solana.git", rev = "fdeda769d05fea4a3f861e787d47d995feee15d7", version = "=1.0.13" }
solana-merkle-tree = { git = "https://github.com/solana-labs/solana.git", rev = "fdeda769d05fea4a3f861e787d47d995feee15d7", version = "=1.0.13" }
solana-rayon-threadlimit = { git = "https://github.com/solana-labs/solana.git", rev = "fdeda769d05fea4a3f861e787d47d995feee15d7", version = "=1.0.13" }
solana-sdk = { git = "https://github.com/solana-labs/solana.git", rev = "fdeda769d05fea4a3f861e787d47d995feee15d7", version = "=1.0.13" }
solana-stake-program = { git = "https://github.com/solana-labs/solana.git", rev = "fdeda769d05fea4a3f861e787d47d995feee15d7", version = "=1.0.13" }
solana-vote-program = { git = "https://github.com/solana-labs/solana.git", rev = "fdeda769d05fea4a3f861e787d47d995feee15d7", version = "=1.0.13" }
tar = "=0.4.26"
tempfile = "=3.1.0"

[dev-dependencies]
bs58 = "=0.3.0"
