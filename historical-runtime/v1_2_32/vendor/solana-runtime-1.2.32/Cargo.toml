[package]
name = "solana-runtime"
version = "1.2.32"
description = "Solana runtime"
authors = ["Solana Maintainers <maintainers@solana.com>"]
repository = "https://github.com/solana-labs/solana"
license = "Apache-2.0"
homepage = "https://solana.com/"
edition = "2018"

[dependencies]
bincode = "1.3.1"
blake3 = "0.3.6"
bv = { version = "0.11.1", features = ["serde"] }
byteorder = "1.3.4"
fnv = "1.0.7"
fs_extra = "1.1.0"
itertools = "0.9.0"
lazy_static = "1.4.0"
libc = "0.2.70"
libloading = "0.6.2"
log = "0.4.8"
memmap = "0.7.0"
num-derive = { version = "0.3" }
num-traits = { version = "0.2" }
num_cpus = "1.13.0"
rand = "0.7.0"
rayon = "1.4.0"
serde = { version = "1.0.110", features = ["rc"] }
serde_derive = "1.0.103"
solana-config-program = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-logger = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-measure = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-metrics = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-rayon-threadlimit = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-sdk = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-stake-program = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
solana-vote-program = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }
tempfile = "3.1.0"
thiserror = "1.0"

[lib]
crate-type = ["lib"]
name = "solana_runtime"

[dev-dependencies]
assert_matches = "1.3.0"
solana-noop-program = { git = "https://github.com/solana-labs/solana.git", rev = "8c989da68342918f1717c60aa60fdfab7d1e676e", version = "1.2.32" }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
