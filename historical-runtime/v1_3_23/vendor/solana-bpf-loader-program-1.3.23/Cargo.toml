[package]
name = "solana-bpf-loader-program"
version = "1.3.23"
description = "Solana BPF loader"
authors = ["Solana Maintainers <maintainers@solana.foundation>"]
repository = "https://github.com/solana-labs/solana"
license = "Apache-2.0"
homepage = "https://solana.com/"
edition = "2018"

[dependencies]
bincode = "1.3.1"
byteorder = "1.3.4"
num-derive = "0.3"
num-traits = "0.2"
solana-runtime = { path = "../solana-runtime-1.3.23", version = "=1.3.23" }
solana-sdk = { git = "https://github.com/solana-labs/solana.git", rev = "ab235b8160f1c76e5066eee52d62d976d12f42f1", version = "=1.3.23" }
solana_rbpf = "=0.1.32"
thiserror = "1.0"

[dev-dependencies]
rand = "0.7.3"
rustversion = "1.0.3"

[lib]
crate-type = ["lib"]
name = "solana_bpf_loader_program"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
