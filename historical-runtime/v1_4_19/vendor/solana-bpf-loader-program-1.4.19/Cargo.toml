[package]
name = "solana-bpf-loader-program"
version = "1.4.19"
description = "Solana BPF loader"
authors = ["Solana Maintainers <maintainers@solana.foundation>"]
repository = "https://github.com/solana-labs/solana"
license = "Apache-2.0"
homepage = "https://solana.com/"
edition = "2018"

[dependencies]
bincode = "1.3.1"
byteorder = "1.3.4"
curve25519-dalek = "3"
num-derive = "0.3"
num-traits = "0.2"
solana-runtime = { path = "../solana-runtime-1.4.19", version = "=1.4.19" }
solana-sdk = { git = "https://github.com/solana-labs/solana.git", rev = "9466ad3c1f11fb90df6015d6c910f0e89747a553", version = "=1.4.19" }
solana_rbpf = "=0.1.34"
thiserror = "1.0"

[dev-dependencies]
rand = "0.7.3"
rustversion = "1.0.3"

[lib]
crate-type = ["lib"]
name = "solana_bpf_loader_program"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
